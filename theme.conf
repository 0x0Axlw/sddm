[General]
# Path to the wallpaper. If it's in the assets folder, use "assets/background.jpg"
background=assets/background.jpg

# Optional: desktop wallpaper synced by scripts/update-wallpaper.sh.
# Leave empty to always use "background" above.
wallpaper=

# Colors
accentColor=#A9C78F
autoColor=true
use24HourClock=false
backgroundColor=#1A1C18
textColor=#E3E3DC

# Optional: Material You palette generated by Matugen (scripts/update-wallpaper.sh).
# While matugen=true the generated colors below take priority over the colors above.
matugen=false
matugenAccent=#A9C78F
matugenBackground=#1A1C18
matugenText=#E3E3DC

# Font family. Override with any installed system font.
fontFamily=
