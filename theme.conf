[General]
# Path to the wallpaper. If it's in the assets folder, use "assets/background.jpg"
background=assets/background.jpg

# Optional: desktop wallpaper synced by scripts/update-wallpaper.sh.
# Leave empty to always use "background" above.
wallpaper=

# Colors
accentColor=#A9C78F
autoColor=true
use24HourClock=true
backgroundColor=#1A1C18
textColor=#E3E3DC

# Date format synced from the end4pc shell (time.dateFormat in
# ~/.config/illogical-impulse/config.json by scripts/update-wallpaper.sh).
# Empty falls back to the long English "dddd, MMMM d" style.
dateFormat=ddd, dd/MM

# Per-user avatars: scripts/change-avatar.sh installs an image into the shared
# SDDM assets dir (the greeter cannot read $HOME) and adds an "avatar_<user>"
# key here, e.g.  avatar_jane=/var/lib/sddm/pixie/avatars/jane.png
# The greeter picks it up on the next login/lock screen.

# Optional: Material You palette generated by Matugen (scripts/update-wallpaper.sh).
# While matugen=true the generated colors below take priority over the colors above.
matugen=false
matugenAccent=#A9C78F
matugenBackground=#1A1C18
matugenText=#E3E3DC

# Font family. Override with any installed system font.
fontFamily=
